<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1a56db"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Water Drop Artwork -->
  <g filter="url(#shadow)">
    <path d="M256 80 C256 80 140 230 140 330 A116 116 0 0 0 372 330 C372 230 256 80 256 80 Z" fill="url(#dropGrad)"/>
    <!-- Highlight -->
    <ellipse cx="215" cy="290" rx="36" ry="60" transform="rotate(-25 215 290)" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Text Badge -->
  <text x="256" y="450" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ASHA RO</text>
</svg>
