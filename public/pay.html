<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHA RO WATER — Smart RFID Card Passbook</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 50%,#0284c7 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#ffffff;border-radius:24px;width:100%;max-width:440px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.3)}
.header{background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;padding:24px 20px;text-align:center;position:relative}
.header h1{font-size:22px;font-weight:900;letter-spacing:0.5px;margin-bottom:4px}
.header p{font-size:12.5px;opacity:.9;font-weight:500}
.body{padding:20px}

/* CUSTOMER BADGE */
.cust-badge{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:14px;padding:14px;text-align:center;margin-bottom:16px}
.cust-name{font-size:19px;font-weight:800;color:#0f172a}
.cust-uid{display:inline-block;font-family:monospace;font-size:11px;font-weight:700;background:#e0f2fe;color:#0369a1;padding:2px 8px;border-radius:6px;margin-top:4px}
.rate-tag{font-size:12px;color:#16a34a;font-weight:700;margin-top:6px}

/* WALLET STATS */
.wallets-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.wallet-box{background:#f0fdf4;border:2px solid #86efac;border-radius:14px;padding:14px 10px;text-align:center}
.wallet-box.cashback{background:#fffbeb;border-color:#fde68a}
.w-title{font-size:11.5px;font-weight:700;color:#15803d;text-transform:uppercase;letter-spacing:0.3px}
.wallet-box.cashback .w-title{color:#b45309}
.w-amount{font-size:26px;font-weight:900;color:#15803d;margin:4px 0}
.wallet-box.cashback .w-amount{color:#d97706}
.w-sub{font-size:10px;color:#64748b;line-height:1.2}

/* CLAIM CASHBACK BUTTON */
.claim-btn{width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:800;cursor:pointer;margin-top:8px;box-shadow:0 3px 10px rgba(217,119,6,0.25);transition:.15s}
.claim-btn:active{transform:scale(0.98)}
.claim-btn:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed;box-shadow:none}

/* DIRECT UPI QR CARD */
.qr-section{background:#f8fafc;border:2px dashed #16a34a;border-radius:18px;padding:18px 14px;text-align:center;margin-bottom:20px}
.qr-badge{display:inline-block;background:#16a34a;color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:12px;letter-spacing:0.3px}
.qr-img-wrap{background:#fff;padding:12px;border-radius:16px;display:inline-block;box-shadow:0 4px 16px rgba(0,0,0,0.08);margin-bottom:12px}
.qr-img-wrap img{width:220px;height:220px;display:block;border-radius:8px;object-fit:contain}
.qr-desc{font-size:12.5px;color:#1e293b;font-weight:700;line-height:1.4}
.qr-desc span{color:#16a34a}
.open-upi-btn{display:inline-block;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;text-decoration:none;font-size:13px;font-weight:800;padding:11px 22px;border-radius:12px;box-shadow:0 4px 12px rgba(22,163,74,0.3);transition:.15s}
.open-upi-btn:active{transform:scale(0.98)}

/* PASSBOOK / TRANSACTIONS */
.history-section{border-top:1.5px solid #f1f5f9;padding-top:16px}
.history-section h3{font-size:14px;font-weight:800;color:#0f172a;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.txn-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.txn-item:last-child{border:none}
.txn-type{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:0.3px}
.type-recharge{background:#def7ec;color:#03543f}
.type-dispense{background:#fee2e2;color:#991b1b}
.type-cashback{background:#fef3c7;color:#92400e}
.type-refund{background:#dbeafe;color:#1e40af;font-weight:800;border:1px solid #93c5fd}
.alert{padding:11px 14px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:14px;text-align:center}
.alert-success{background:#def7ec;color:#03543f;border:1px solid #bbf7d0}
.alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.loading{text-align:center;padding:50px 20px;color:#64748b;font-weight:600}
.blocked-msg{background:#fef2f2;border:2px solid #f87171;border-radius:14px;padding:24px;text-align:center;color:#991b1b}
.footer{text-align:center;font-size:11px;color:#94a3b8;padding-top:14px;border-top:1px solid #f1f5f9;margin-top:14px;font-weight:500}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>🚰 ASHA RO WATER</h1>
    <p>Smart RFID Card • Live Digital Passbook</p>
  </div>
  <div class="body" id="mainBody">
    <div class="loading">⏳ Passbook Load Ho Rahi Hai...</div>
  </div>
</div>

<script>
const customerId = window.location.pathname.split('/pay/')[1];
let currentCustomer = null;

async function loadPage(){
  const mainBody = document.getElementById('mainBody');

  if (!customerId) {
    mainBody.innerHTML = `
      <div style="text-align:center;padding:26px 12px">
        <h3 style="color:#0f172a;margin-bottom:6px;font-size:20px;font-weight:800">🚰 ASHA RO WATER</h3>
        <p style="font-size:13px;color:#64748b;margin-bottom:18px">Apna Mobile No, Card UID ya Payment/Order ID dalein aur Passbook dekhein:</p>
        <div style="display:flex;gap:8px;max-width:340px;margin:0 auto 16px">
          <input type="text" id="manualLookupInput" placeholder="Mobile / Card UID / Order ID" style="flex:1;padding:11px 14px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:13px;outline:none" onkeyup="if(event.key==='Enter')handleManualLookup()">
          <button onclick="handleManualLookup()" style="background:#0284c7;color:#fff;border:none;border-radius:12px;padding:0 18px;font-weight:700;font-size:13px;cursor:pointer">खोजें</button>
        </div>
        <div style="font-size:12px;color:#0284c7;font-weight:700">Banwariya • Smart Water ATM</div>
      </div>`;
    return;
  }

  const res = await fetch(`/api/pay-info/${customerId}`).then(r=>r.json()).catch(()=>null);
  if(!res || !res.success){
    mainBody.innerHTML = `<div class="blocked-msg">❌ Card details load nahi ho paayi. Kripya dobara scan karein.</div>`;
    return;
  }

  if(res.status === 'blocked'){
    mainBody.innerHTML = `
      <div class="blocked-msg">
        🚫 <b>Yeh card block kar diya gaya hai.</b><br><br>
        Kripya van operator se sampark karein.<br>📞 7700828989
      </div>`;
    return;
  }

  currentCustomer = res;
  const cbVal = parseFloat(res.cashback_rs || 0);

  // Fetch or generate pure square direct UPI QR details
  let qrImgSrc = res.upi_qr_data;
  if (!qrImgSrc) {
    const qrRes = await fetch(`/api/customer-card-qrs/${res.id}`).then(r=>r.json()).catch(()=>null);
    if (qrRes && qrRes.side1_upi_qr) {
      qrImgSrc = qrRes.side1_upi_qr;
    }
  }
  if (!qrImgSrc) {
    qrImgSrc = res.razorpay_qr_image;
  }

  mainBody.innerHTML = `
    <div id="alertBox"></div>

    ${res.machine_status === 'maintenance' ? `
      <div style="background:#fee2e2;border:1.5px solid #f87171;color:#991b1b;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:14px;text-align:center">
        🛠️ <strong>मशीन अभी बंद (Maintenance Mode) है</strong><br>
        <span style="font-size:11.5px;font-weight:500">रखरखाव कार्य चल रहा है। कृपया कुछ देर बाद कार्ड से पानी निकालें।</span>
      </div>
    ` : ''}

    <!-- CUSTOMER PROFILE -->
    <div class="cust-badge">
      <div class="cust-name">👤 ${res.full_name || res.display_name}</div>
      ${res.card_uid ? `<div class="cust-uid">RFID UID: ${res.card_uid}</div>` : ''}
      <div class="rate-tag">💧 1 रुपये = 1 लीटर शुद्ध RO पानी</div>
    </div>

    <!-- WALLET & CASHBACK STATS -->
    <div class="wallets-grid">
      <!-- Water Wallet -->
      <div class="wallet-box">
        <div class="w-title">💧 Card Balance</div>
        <div class="w-amount" id="cardBalTxt">₹${res.balance_rs}</div>
        <div class="w-sub">Machine Par Tap Karke Paani Nikalein</div>
      </div>

      <!-- Cashback Wallet -->
      <div class="wallet-box cashback">
        <div class="w-title">🎁 Cashback</div>
        <div class="w-amount" id="cashbackTxt">₹${res.cashback_rs || '0.00'}</div>
        <div class="w-sub" id="cashbackSubTxt">Har ${res.cashback_litres || 20}L Par ₹${res.cashback_reward_rs || 1} Cashback</div>
        <button class="claim-btn" id="claimBtn" ${cbVal <= 0 ? 'disabled' : ''} onclick="claimCashback()">
          ${cbVal > 0 ? `🎁 Claim ₹${cbVal.toFixed(0)}` : 'Claim Karein'}
        </button>
      </div>
    </div>

    <!-- DIRECT UPI QR CODE -->
    <div class="qr-section">
      <div class="qr-badge">⚡ DIRECT UPI RECHARGE QR</div>
      <div class="qr-img-wrap">
        <img src="${qrImgSrc || 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=ASHA_RO_WATER'}" alt="Direct UPI QR">
      </div>
      <div class="qr-desc">
        <b>PhonePe / Google Pay / Paytm</b> se scan karein<br>
        <span>Direct amount daal kar recharge karein — Paisa card mein add hoga!</span>
      </div>
      ${res.upi_intent ? `
        <div style="margin-top:14px">
          <a href="${res.upi_intent}" class="open-upi-btn">
            📲 Is Mobile Me PhonePe / GPay Kholein
          </a>
        </div>
      ` : ''}
    </div>

    <!-- RECENT TRANSACTIONS (PASSBOOK) -->
    <div class="history-section">
      <h3>
        <span>📋 Passbook History</span>
        <button onclick="loadHistory()" style="background:none;border:none;color:#0284c7;font-size:12px;font-weight:700;cursor:pointer">🔄 Refresh</button>
      </h3>
      <div id="histBody">Loading history...</div>
    </div>

    <div class="footer">ASHA RO WATER — Banwariya • Smart Card Passbook</div>
  `;

  loadHistory();
}

async function claimCashback(){
  if(!customerId) return;
  const btn = document.getElementById('claimBtn');
  if(btn) { btn.disabled = true; btn.textContent = '⏳ Claiming...'; }

  const res = await fetch('/api/claim-cashback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ customer_id: customerId })
  }).then(r=>r.json()).catch(()=>null);

  if(res && res.success){
    showAlert(res.message, 'success');
    document.getElementById('cardBalTxt').textContent = `₹${res.new_balance_rs}`;
    document.getElementById('cashbackTxt').textContent = `₹0.00`;
    if(btn) { btn.disabled = true; btn.textContent = 'Claimed!'; }
    loadHistory();
  } else {
    showAlert(res ? res.message : 'Claim error', 'error');
    if(btn) { btn.disabled = false; btn.textContent = 'Claim Karein'; }
  }
}

async function loadHistory(){
  const histEl = document.getElementById('histBody');
  if(!histEl || !customerId) return;

  const res = await fetch(`/api/transactions/${customerId}`).then(r=>r.json()).catch(()=>null);
  const items = (res && res.data) ? res.data.slice(0, 10) : [];

  if(!items.length){
    histEl.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:12px;font-size:12px">Abhi koi transaction nahi hai</div>';
    return;
  }

  histEl.innerHTML = items.map(t=>{
    const isRefund = t.type === 'REFUND' || t.status === 'AUTO_REFUNDED' || (t.note && (t.note.includes('AUTO-REFUNDED') || t.note.includes('रिफंड') || t.note.includes('REFUND')));
    const isCredit = t.type === 'RECHARGE' || t.type === 'CASHBACK' || isRefund;
    const typeClass = isRefund ? 'type-refund' : (t.type === 'RECHARGE' ? 'type-recharge' : (t.type === 'CASHBACK' ? 'type-cashback' : 'type-dispense'));
    const typeLabel = isRefund ? 'REFUND' : t.type;
    const amtStr = ((Math.abs(t.amount_paise) || 0) / 100).toFixed(2);
    const dateStr = (t.created_at || '').substring(0, 16);

    const refundNotice = isRefund ? `
      <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:7px 10px;margin-top:6px;font-size:11.5px;color:#1e40af;font-weight:600;line-height:1.4">
        💳 <strong>रिफंड प्रोसेस हो चुका है</strong><br>
        24 घंटे के अंदर आपके बैंक खाते / UPI में क्रेडिट हो जाएगा।<br>
        <span style="font-size:10.5px;color:#3b82f6;font-family:monospace">Ref ID: ${t.payment_ref || t.id}</span>
      </div>
    ` : '';

    return `
      <div class="txn-item" style="${isRefund ? 'background:#f8fafc;padding:10px;border-radius:10px;margin-bottom:8px;border:1px solid #e2e8f0;' : ''}">
        <div style="flex:1">
          <span class="txn-type ${typeClass}">${typeLabel}</span>
          <div style="font-size:11px;color:#64748b;margin-top:4px">${t.note || ''} • <span style="color:#94a3b8">${dateStr}</span></div>
          ${refundNotice}
        </div>
        <b style="color:${isRefund ? '#2563eb' : (isCredit ? '#15803d' : '#b91c1c')};font-size:14px;white-space:nowrap;margin-left:8px">
          ${isCredit ? '+' : '-'}₹${amtStr}
        </b>
      </div>
    `;
  }).join('');
}

function handleManualLookup(){
  const val = (document.getElementById('manualLookupInput')?.value || '').trim();
  if(!val){ alert('Kripya Mobile No, Card UID ya Order ID dalein'); return; }
  window.location.href = '/pay/' + encodeURIComponent(val);
}

function showAlert(msg, type){
  const el = document.getElementById('alertBox');
  if(!el) return;
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(()=>{ if(el) el.innerHTML = ''; }, 7000);
}

loadPage();
</script>
</body>
</html>
